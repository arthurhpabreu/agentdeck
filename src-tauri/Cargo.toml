[package]
name = "agentdeck"
version = "0.6.2"
description = "Agentdeck desktop workspace for official coding agents"
authors = ["Arthur Abreu"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/arthurhpabreu/agentdeck"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tauri-plugin-notification = "2.3.3"
toml = "0.9.12"
regex = "1"
sha2 = "0.10"
notify = "6.1.1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
time = { version = "0.3", features = ["parsing"] }
httpdate = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
mac-notification-sys = "0.6"
