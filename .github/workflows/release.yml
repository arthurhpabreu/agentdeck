name: Windows draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install --global corepack --force
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check:repo
      - run: corepack pnpm check:i18n
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version differ" }
      - run: powershell -NoProfile -File scripts/build-windows.ps1
      - name: Prepare installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/Agentdeck_${version}_x64-setup.exe" -Destination release-assets
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/msi/Agentdeck_${version}_x64_en-US.msi" -Destination release-assets
          Copy-Item -LiteralPath LICENSE -Destination release-assets
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem release-assets -File | Select-Object -ExpandProperty FullName
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -eq 'false') {
              Write-Output 'This release is already published; its assets are preserved.'
              exit 0
            }
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --draft --generate-notes --title "Agent Deck $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the draft release' }
